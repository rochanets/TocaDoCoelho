services:
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: toca-evolution-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: "toca-test-key-2024"
      DATABASE_ENABLED: "false"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    restart: unless-stopped

volumes:
  evolution_instances:
