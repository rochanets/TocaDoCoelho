name: Docker (imagem web)

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem web
        run: docker build -t tocadocoelho-web:ci .

      - name: Validar stack de produção
        run: >-
          docker compose
          --env-file .env.production.example
          -f docker-compose.production.yml
          config

      - name: Produção incompleta deve falhar fechada
        run: |
          if docker run --rm -e TOCA_ENV=production tocadocoelho-web:ci python -c "import app"; then
            echo "ERRO: runtime de produção iniciou sem configuração obrigatória"
            exit 1
          fi
          echo "runtime recusou configuração insegura como esperado"

      - name: Subir o container
        run: docker run -d --name toca-web -p 3000:3000 tocadocoelho-web:ci

      - name: Smoke test — /healthz responde 200
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then
              echo; echo "healthz OK"; exit 0
            fi
            echo "tentativa $i: ainda subindo..."; sleep 2
          done
          echo "healthz não respondeu a tempo"; exit 1

      - name: Smoke test — documentos, transcrição e Companion
        run: |
          docker exec toca-web python -c "import importlib.util; import app, transcription_service; assert app.PDFPLUMBER_AVAILABLE and app.PYTHON_DOCX_AVAILABLE; assert importlib.util.find_spec('faster_whisper') is None; assert importlib.util.find_spec('playwright') is None; assert transcription_service.MAX_AUDIO_SECONDS == 55; assert app.COMPANION_PROTOCOL_VERSION == 1; pdf = app._briefings_to_pdf('Smoke PDF', [('Seção', 'Conteúdo')]); assert pdf and pdf.startswith(b'%PDF-')"

      - name: Logs do container
        if: always()
        run: docker logs toca-web || true

      - name: Derrubar o container
        if: always()
        run: docker rm -f toca-web || true
