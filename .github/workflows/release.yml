name: Build & Release Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do release (ex: 5.3.0.1)'
        required: true
        default: '5.3.0.1'
      release_notes:
        description: 'Notas do release (opcional — usa padrão se vazio)'
        required: false
  push:
    branches: [main]
    paths: [version.txt]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout + resolver versão
      # -----------------------------------------------------------------------
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Resolver versão do release
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=$(cat version.txt | tr -d '[:space:]')
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Versão: $VERSION"

      # -----------------------------------------------------------------------
      # 2. Python
      # -----------------------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        shell: cmd
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m pywin32_postinstall -install 2>nul
          exit /b 0

      # -----------------------------------------------------------------------
      # 3. Node.js (para waha-lite npm install)
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install waha-lite npm dependencies
        shell: cmd
        # PUPPETEER_SKIP_CHROMIUM_DOWNLOAD evita o download do Chromium bundled (~150MB).
        # O app já usa o Chrome/Edge instalado no PC do usuário via executablePath.
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: cd waha-lite && npm install && cd ..

      # -----------------------------------------------------------------------
      # 4. node.exe portátil (bundled no instalador)
      # -----------------------------------------------------------------------
      - name: Download node.exe portátil (Windows x64)
        shell: powershell
        run: |
          $url = 'https://nodejs.org/dist/v24.16.0/win-x64/node.exe'
          Invoke-WebRequest -Uri $url -OutFile 'node.exe'
          Write-Host "node.exe: $((Get-Item node.exe).Length / 1MB -as [int]) MB"

      # -----------------------------------------------------------------------
      # 5. Build PyInstaller
      # -----------------------------------------------------------------------
      - name: Build executável com PyInstaller
        shell: cmd
        run: |
          pyinstaller ^
            --name TocaDoCoelho ^
            --onedir ^
            --noconsole ^
            --icon coelho_icon_transparent.ico ^
            --add-data "app.py;." ^
            --add-data "routes;routes" ^
            --add-data "public;public" ^
            --add-data "integrations;integrations" ^
            --add-data "graph_credentials.py;." ^
            --add-data "README.md;." ^
            --add-data "coelho_icon_transparent.ico;." ^
            --hidden-import app ^
            --hidden-import graph_credentials ^
            --hidden-import win32timezone ^
            --hidden-import win32api ^
            --hidden-import win32con ^
            --hidden-import win32gui ^
            --collect-all faster_whisper ^
            --collect-all onnxruntime ^
            launcher.py
          if %ERRORLEVEL% neq 0 (
            echo [ERRO] PyInstaller falhou
            exit /b 1
          )

      - name: Escrever version.txt
        shell: cmd
        run: echo ${{ steps.ver.outputs.VERSION }}> dist\TocaDoCoelho\version.txt

      # -----------------------------------------------------------------------
      # 6. NSIS installer
      # -----------------------------------------------------------------------
      - name: Verificar artefatos do WhatsApp Update (WAHA-lite)
        # Falha cedo se node.exe / node_modules sumirem: o installer.nsi os embute via 'File'
        # e, sem eles, o WhatsApp Update fica indisponível em produção (sem Docker) — bug que
        # passava despercebido porque o build compilava normalmente.
        shell: powershell
        run: |
          $erros = @()
          if (-not (Test-Path 'node.exe'))                                { $erros += 'node.exe (Node.js portatil) ausente na raiz do projeto' }
          if (-not (Test-Path 'waha-lite\waha-lite.js'))                  { $erros += 'waha-lite\waha-lite.js ausente' }
          if (-not (Test-Path 'waha-lite\node_modules\express'))          { $erros += 'waha-lite\node_modules ausente (rode npm install em waha-lite)' }
          if (-not (Test-Path 'waha-lite\node_modules\whatsapp-web.js'))  { $erros += 'waha-lite\node_modules\whatsapp-web.js ausente' }
          if ($erros.Count -gt 0) {
            Write-Host '[ERRO] Artefatos do WhatsApp Update ausentes -- o instalador ficaria sem WAHA-lite:'
            $erros | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          Write-Host '[OK] node.exe + waha-lite/node_modules presentes -- WAHA-lite sera embutido no instalador.'

      - name: Instalar NSIS
        shell: powershell
        run: choco install nsis --no-progress -y

      - name: Compilar instalador NSIS
        shell: cmd
        env:
          TOCA_APP_VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set "NSIS_EXE=C:\Program Files (x86)\NSIS\makensis.exe"
          if not exist "%NSIS_EXE%" set "NSIS_EXE=C:\Program Files\NSIS\makensis.exe"
          echo %TOCA_APP_VERSION%> dist\TocaDoCoelho\version.txt
          "%NSIS_EXE%" /V4 /DAPP_VERSION=%TOCA_APP_VERSION% installer.nsi
          if %ERRORLEVEL% neq 0 (
            echo [ERRO] NSIS falhou
            exit /b 1
          )

      # -----------------------------------------------------------------------
      # 7. SHA256
      # -----------------------------------------------------------------------
      - name: Calcular SHA256
        shell: powershell
        run: |
          $file = "TocaDoCoelho-${{ steps.ver.outputs.VERSION }}-Setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Out-File -FilePath "$file.sha256" -Encoding UTF8 -NoNewline
          Write-Host "SHA256: $hash"

      # -----------------------------------------------------------------------
      # 8. Resolver notas do release
      # -----------------------------------------------------------------------
      - name: Resolver notas do release
        shell: bash
        env:
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          if [ -n "$CUSTOM_NOTES" ]; then
            printf '%s' "$CUSTOM_NOTES" > release_notes.md
          else
            cat > release_notes.md << 'ENDOFNOTES'
          ## 🐇 Toca do Coelho

          ### ✨ Novidades

          #### Outlook — Sincronização Inteligente
          - Agrupa threads de e-mail por assunto com resumo consolidado
          - Deduplicação persistente: e-mails já importados não aparecem novamente
          - Suporte a múltiplos destinatários (CC e BCC) na importação
          - Popup branded com resultado detalhado após sincronização

          ### 🔧 Correções

          #### WhatsApp Update
          - Elimina processo Chrome órfão ao iniciar e ao reciclar a sessão
          - Corrigido crash `EADDRINUSE` no restart do WAHA-lite
          - Watchdog agora recicla corretamente sessão travada após autenticar
          - Permite fixar versão do WhatsApp Web (`webVersionCache`) para contornar bug de 99%/LOGOUT
          - Logging detalhado para diagnóstico de sessões travadas

          #### Segurança
          - Permissões do arquivo SQLite restritas ao usuário atual do sistema operacional
          - Corrigidos achados SAST: PKCE, DPAPI, remoção de PowerShell/COM e `client_secret` no frontend

          #### Contas
          - Excluir conta agora move para arquivo em vez de apagar permanentemente
          - Corrigida duplicação ao renomear conta

          #### iAta / IA
          - SAI agora é o provedor primário de LLM; OpenRouter como fallback
          - Integração SAI corrigida: migrada de `urllib` para `requests`
          - Logging de sucesso adicionado em todas as chamadas SAI

          #### UI
          - Ajustes no modal Preparar Reunião e Relationship Report
          - Ícone do Outlook corrigido na barra lateral

          ### 📦 Instalação
          1. Baixe `TocaDoCoelho-Setup.exe`
          2. Execute e siga o assistente (next, next, finish)
          3. Verifique a integridade com o arquivo `.sha256`

          > **Atualização:** o instalador preserva seus dados automaticamente. Nenhuma migração necessária.
          ENDOFNOTES
          fi

      # -----------------------------------------------------------------------
      # 9. GitHub Release
      # -----------------------------------------------------------------------
      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: "🐇 Toca do Coelho v${{ steps.ver.outputs.VERSION }}"
          body_path: release_notes.md
          files: |
            TocaDoCoelho-${{ steps.ver.outputs.VERSION }}-Setup.exe
            TocaDoCoelho-${{ steps.ver.outputs.VERSION }}-Setup.exe.sha256
          draft: false
          prerelease: false
