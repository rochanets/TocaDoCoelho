name: tocadocoelho-production

x-toca-image: &toca-image "tocadocoelho-web:${TOCA_IMAGE_TAG:-local}"
x-toca-environment: &toca-environment
  TOCA_ENV: production
  TOCA_DATA_DIR: /data
  TOCA_AUTH_ENABLED: "1"
  TOCA_COOKIE_SECURE: "1"
  TOCA_COOKIE_SAMESITE: "${TOCA_COOKIE_SAMESITE:-Lax}"
  TOCA_TRUST_PROXY: "1"
  TOCA_RUN_MIGRATIONS_ON_STARTUP: "0"
  TOCA_LOG_FORMAT: "${TOCA_LOG_FORMAT:-json}"
  TOCA_LOG_FILE_ENABLED: "${TOCA_LOG_FILE_ENABLED:-0}"
  WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
  TOCA_MULTIWORKER_JOBS_ENABLED: "1"
  TOCA_DISABLE_BG_JOBS: "${TOCA_DISABLE_BG_JOBS:-0}"
  TOCA_JOB_HEARTBEAT_SECONDS: "${TOCA_JOB_HEARTBEAT_SECONDS:-30}"
  TOCA_TASK_STATE_TTL_HOURS: "${TOCA_TASK_STATE_TTL_HOURS:-24}"
  TOCA_TIMEZONE: "${TOCA_TIMEZONE:-America/Sao_Paulo}"
  TZ: "${TOCA_TIMEZONE:-America/Sao_Paulo}"
  SECRET_KEY: "${SECRET_KEY:?Defina SECRET_KEY estável fora do Git}"
  DATABASE_URL: "${DATABASE_URL:?Defina DATABASE_URL PostgreSQL fora do Git}"
  OUTLOOK_GRAPH_TENANT_ID: "${OUTLOOK_GRAPH_TENANT_ID:?Defina o tenant do Entra}"
  OUTLOOK_GRAPH_CLIENT_ID: "${OUTLOOK_GRAPH_CLIENT_ID:?Defina o client ID do Entra}"
  OUTLOOK_GRAPH_LOGIN_REDIRECT_URI: "${OUTLOOK_GRAPH_LOGIN_REDIRECT_URI:?Defina o redirect HTTPS de login}"
  OUTLOOK_GRAPH_REDIRECT_URI: "${OUTLOOK_GRAPH_REDIRECT_URI:?Defina o redirect HTTPS do Outlook}"
  OUTLOOK_GRAPH_LOGIN_SCOPE: "${OUTLOOK_GRAPH_LOGIN_SCOPE:-openid profile email User.Read}"
  OUTLOOK_GRAPH_SCOPE: "${OUTLOOK_GRAPH_SCOPE:-offline_access Mail.Read Mail.Send User.Read}"
  WAHA_API_URL: "http://waha:3000"
  WAHA_API_KEY: "${WAHA_API_KEY:?Defina a chave plain da API WAHA fora do Git}"
  WAHA_API_KEY_HASH: "${WAHA_API_KEY_HASH:?Defina o hash SHA-512 da chave API fora do Git}"
  WAHA_SESSION_NAME: "${WAHA_SESSION_NAME:-default}"
  WAHA_WEBHOOK_HMAC_KEY: "${WAHA_WEBHOOK_HMAC_KEY:?Defina a chave HMAC do webhook fora do Git}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Defina POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Defina POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD fora do Git}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  migrate:
    image: *toca-image
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TOCA_BUILD_SHA: "${TOCA_BUILD_SHA:-unknown}"
        TOCA_BUILD_VERSION: "${TOCA_BUILD_VERSION:-dev}"
    command: ["python", "manage.py", "migrate"]
    environment:
      TOCA_ENV: production
      TOCA_PROCESS_ROLE: migrate
      TOCA_DATA_DIR: /data
      TOCA_DISABLE_BG_JOBS: "1"
      TOCA_RUN_MIGRATIONS_ON_STARTUP: "0"
      TOCA_LOG_FORMAT: "${TOCA_LOG_FORMAT:-json}"
      TOCA_LOG_FILE_ENABLED: "${TOCA_LOG_FILE_ENABLED:-0}"
      SECRET_KEY: "${SECRET_KEY:?Defina SECRET_KEY estável fora do Git}"
      DATABASE_URL: "${DATABASE_URL:?Defina DATABASE_URL PostgreSQL fora do Git}"
    volumes:
      - toca_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  web:
    image: *toca-image
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TOCA_BUILD_SHA: "${TOCA_BUILD_SHA:-unknown}"
        TOCA_BUILD_VERSION: "${TOCA_BUILD_VERSION:-dev}"
    environment: *toca-environment
    volumes:
      - toca_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/readyz', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped
    networks:
      - backend
      - edge
    security_opt:
      - no-new-privileges:true

  postgres-backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:?Defina POSTGRES_DB}"
      PGUSER: "${POSTGRES_USER:?Defina POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD fora do Git}"
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
    command: ["sh", "/opt/toca/backup-loop.sh"]
    volumes:
      - ./deploy/postgres:/opt/toca:ro
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /backups/.last-success"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  waha:
    image: devlikeapro/waha:latest-2026.7.1
    environment:
      WHATSAPP_DEFAULT_ENGINE: "WEBJS"
      WAHA_API_KEY: "${WAHA_API_KEY_HASH:?Defina o hash SHA-512 da chave API fora do Git}"
      WHATSAPP_API_KEY_EXCLUDE_PATH: "health"
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WAHA_LOCAL_STORE_BASE_DIR: "/app/.sessions"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WHATSAPP_DOWNLOAD_MEDIA: "false"
      WHATSAPP_HOOK_URL: "http://web:3000/api/whatsapp/webhook"
      WHATSAPP_HOOK_EVENTS: "message.any"
      WHATSAPP_HOOK_HMAC_KEY: "${WAHA_WEBHOOK_HMAC_KEY:?Defina a chave HMAC do webhook fora do Git}"
      WHATSAPP_HOOK_RETRIES_POLICY: "linear"
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "2"
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "4"
      WAHA_LOG_FORMAT: "JSON"
      WAHA_LOG_LEVEL: "info"
      WAHA_HTTP_LOG_LEVEL: "info"
      TZ: "${TOCA_TIMEZONE:-America/Sao_Paulo}"
    expose:
      - "3000"
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - backend
      - waha_egress
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${TOCA_HTTP_PORT:-80}:80"
      - "${TOCA_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/toca.conf:/etc/nginx/conf.d/default.conf:ro
      - "${TLS_CERTS_DIR:-./deploy/nginx/certs}:/etc/nginx/tls:ro"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
      - edge
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  postgres_backups:
  toca_data:
  waha_sessions:

networks:
  backend:
    internal: true
  edge:
  waha_egress:
