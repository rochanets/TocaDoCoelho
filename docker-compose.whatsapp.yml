services:
  waha:
    image: devlikeapro/waha:latest
    container_name: toca-waha
    ports:
      # WAHA escuta na 3000 dentro do container; expomos na 3001 para não
      # conflitar com o Toca do Coelho (que usa a 3000 no host).
      - "3001:3000"
    environment:
      # Engine baseada em navegador (estável, plano gratuito)
      WHATSAPP_DEFAULT_ENGINE: "WEBJS"
      # Proteção da API por chave (header X-Api-Key)
      WHATSAPP_API_KEY: "toca-test-key-2024"
      # Sessão persistida em arquivo (reconecta sem reescanear o QR)
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WHATSAPP_DOWNLOAD_MEDIA: "false"
    volumes:
      - waha_sessions:/app/.sessions
    restart: unless-stopped

volumes:
  waha_sessions:
